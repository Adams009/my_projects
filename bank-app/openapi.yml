openapi: 3.0.0

info:
  title: Bank App API
  description: A secure banking application API for user authentication and account management
  version: 1.0.0
  license:
    name: ISC

servers:
  - url: http://localhost:4000
    description: Development server
  - url: https://api.bankapp.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Account
    description: Account management endpoints

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                firstName:
                  type: string
                  description: User's first name
                  example: John
                lastName:
                  type: string
                  description: User's last name
                  example: Doe
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  description: User's password
                  example: SecurePassword123!
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User registered successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: User ID
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                      accountNumber:
                        type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  description: User's password
                  example: SecurePassword123!
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abcde12345; Path=/; HttpOnly; Max-Age=604800; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Login successful.
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        description: JWT access token
                      id:
                        type: string
                        description: User ID
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      operationId: refreshToken
      description: Refresh the access token using the refresh token from cookies
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=newtoken123; Path=/; HttpOnly; Max-Age=604800; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Token refreshed successfully.
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        description: New JWT access token
                      id:
                        type: string
                        description: User ID
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/account/balance/{userId}:
    get:
      tags:
        - Account
      summary: Get account balance
      operationId: getBalance
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Balance retrieved successfully.
                  data:
                    type: object
                    properties:
                      balance:
                        type: number
                        format: double
                        example: 5000.00
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/account/deposit/{userId}:
    post:
      tags:
        - Account
      summary: Deposit money to account
      operationId: depositMoney
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                  description: Deposit amount
                  example: 500.00
      responses:
        '200':
          description: Deposit successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Deposit successful.
                  data:
                    type: object
                    properties:
                      balance:
                        type: number
                        format: double
                        example: 5500.00
        '400':
          description: Invalid amount or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/account/withdraw/{userId}:
    post:
      tags:
        - Account
      summary: Withdraw money from account
      operationId: withdrawMoney
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0.01
                  description: Withdrawal amount
                  example: 200.00
      responses:
        '200':
          description: Withdrawal successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Withdrawal successful.
                  data:
                    type: object
                    properties:
                      balance:
                        type: number
                        format: double
                        example: 4800.00
        '400':
          description: Invalid amount, insufficient funds, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: MongoDB object ID
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        accountNumber:
          type: string
          x-unique: true
          description: User's unique account number
        balance:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Transaction:
      type: object
      properties:
        id:
          type: string
          description: MongoDB object ID
        userId:
          type: string
          description: Reference to User
        type:
          type: string
          enum:
            - deposit
            - withdrawal
        amount:
          type: number
          format: double
          minimum: 0.01
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login endpoint